<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HerbSafe 中西通</title>
  <meta name="description" content="Check Chinese herbs and Western medicines together. Chinese and Western medicine, safely together.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HerbSafe">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231D3F8F'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip_link">Skip to content</a>
  <div id="sr-alert" class="visually-hidden" role="alert" aria-live="assertive"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/cabinet" aria-label="HerbSafe 中西通, home" data-i18n-label="brand_home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">HerbSafe <span class="brand-zh" lang="zh-HK">中西通</span></span>
      </a>
      <nav class="site-nav" aria-label="Main" data-i18n-label="nav_main">
        <a href="#/cabinet" data-route-link="check" data-i18n="nav_check">My cabinet</a>
        <a href="#/summary" data-route-link="summary" data-i18n="nav_summary">Doctor summary</a>
        <a href="#/about" data-route-link="about" data-i18n="nav_about">About</a>
      </nav>
      <div class="header-tools">
        <div class="mode-toggle" role="group" aria-label="Display" data-i18n-label="mode_label">
          <button type="button" id="mode-simple" aria-pressed="true" data-i18n="mode_simple">Simple</button>
          <button type="button" id="mode-full" aria-pressed="false" data-i18n="mode_full">Full design</button>
        </div>
        <button type="button" id="lang-toggle" class="lang-toggle" aria-label="Switch language to 繁體中文 (Traditional Chinese)">繁體中文</button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <div id="app">
      <p class="loading" data-i18n="loading">Loading…</p>
    </div>
    <noscript>
      <p class="notice">HerbSafe needs JavaScript to look up your herbs and medicines. Please turn JavaScript on.</p>
      <p class="notice" lang="zh-HK">HerbSafe 需要 JavaScript 先可以查你嘅中藥同西藥。請開啟 JavaScript。</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p data-i18n="footer_disclaimer">HerbSafe gives information, not medical advice. Never stop or change a medicine without talking to your doctor or pharmacist.</p>
      <p class="muted" data-i18n="footer_privacy">No accounts, no tracking. Your list stays on this device.</p>
      <p class="muted zh-note" id="zh-note" hidden></p>
    </div>
  </footer>

  <script src="js/lookup.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
